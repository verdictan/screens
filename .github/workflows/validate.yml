name: Validate Screens
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run test:integration
      - run: npm run test:e2e
      - name: Capture actual PR base and head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCREENS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/prove-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-workflow-proof
          path: |
            test-results/
            playwright-report/
      - run: npm run skills:validate && npm run skills:package
      - uses: actions/upload-artifact@v4
        with:
          name: screens-agent-skills
          path: dist/
  deployment:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: screens-ci
      SCREENS_PORT: 4900
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T screens node scripts/smoke-deployment.mjs write
      - run: docker compose restart && docker compose up -d --wait
      - run: docker compose exec -T screens node scripts/smoke-deployment.mjs read
      - if: always()
        run: docker compose logs && docker compose down
